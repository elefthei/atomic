<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1270">
  <title>Atomic — Anatomy of a missed step</title>
  <link rel="stylesheet" href="../_shared/fonts.css">
  <link rel="stylesheet" href="../_shared/tokens.css">
  <link rel="stylesheet" href="../_shared/components.css">
  <link rel="stylesheet" href="../_shared/tui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1270px; height: 760px; overflow: hidden; }

    :root {
      --warm-alarm:    oklch(72% 0.18 15);
      --warm-alarm-hi: oklch(82% 0.16 25);
      --warm-alarm-bg: oklch(40% 0.10 15 / 0.18);
      --cool-stroke:   oklch(78% 0.14 220);
      --cool-fill:     oklch(60% 0.16 220 / 0.10);
    }

    /* ------------------------------------------------------------
       Headline
       ------------------------------------------------------------ */
    .headline {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 46px;
      line-height: 1.06;
      letter-spacing: -0.022em;
      color: var(--mocha-text);
      max-width: 1100px;
      margin-bottom: 18px;
      position: relative;
      z-index: 2;
    }

    /* ------------------------------------------------------------
       Diagram zone — fixed dims so SVG coords are exact
       ------------------------------------------------------------ */
    .diagram {
      position: relative;
      width: 1158px;
      height: 538px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .diagram__svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ------------------------------------------------------------
       Central incident node
       ------------------------------------------------------------ */
    .incident {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 196px;
      height: 154px;
      border-radius: 10px;
      border: 1.5px solid var(--warm-alarm);
      background: linear-gradient(180deg, oklch(20% 0.06 20 / 0.95), oklch(15% 0.04 25 / 0.96));
      box-shadow:
        0 0 0 6px oklch(72% 0.18 15 / 0.08),
        0 0 32px oklch(72% 0.18 15 / 0.30),
        0 18px 38px oklch(15% 0.06 20 / 0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 3;
    }

    .incident__chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 24px;
      padding: 0 12px;
      background: oklch(28% 0.10 20 / 0.95);
      border-bottom: 1px solid oklch(72% 0.18 15 / 0.40);
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--warm-alarm);
      font-weight: 700;
    }

    .incident__chrome-meta {
      color: oklch(70% 0.10 25 / 0.80);
      font-weight: 500;
      letter-spacing: 0.10em;
    }

    .incident__body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px;
    }

    .incident__label {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--warm-alarm-hi);
    }

    .incident__sub {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mocha-overlay1);
    }

    /* ------------------------------------------------------------
       Satellite — icon + label + tiny dim sub-line
       ------------------------------------------------------------ */
    .sat {
      position: absolute;
      width: 188px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .sat__icon {
      width: 92px;
      height: 56px;
      border-radius: 7px;
      background: var(--cool-fill);
      border: 1px solid var(--cool-stroke);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px oklch(15% 0.05 25 / 0.35);
    }

    .sat__label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 0.02em;
      color: var(--mocha-sapphire);
      text-transform: capitalize;
      line-height: 1.1;
      text-align: center;
    }

    .sat__sub {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: oklch(70% 0.08 220 / 0.75);
      text-align: center;
      margin-top: -4px;
    }

    /* Satellite anchors (centers) */
    .sat--tl { left:  46px; top:  20px; }
    .sat--tr { right: 46px; top:  20px; }
    .sat--bl { left:  46px; bottom: 20px; }
    .sat--br { right: 46px; bottom: 20px; }
  </style>
</head>
<body>
  <div class="slide">

    <!-- Warm conic sweep — risk / friction pole, matches gallery bookends -->
    <div class="conic-sweep conic-sweep--warm-anchor"></div>

    <!-- Film grain -->
    <div class="film-grain"></div>

    <!-- Content layer -->
    <div class="slide__content" style="padding: 36px 56px 36px; display: flex; flex-direction: column; height: 100%;">

      <!-- Wordmark -->
      <div style="display: flex; align-items: center; margin-bottom: 18px;">
        <div class="wordmark">ATOMIC</div>
      </div>

      <!-- Headline at top — talk-track payoff line, bubble warm on `cascades` -->
      <h1 class="headline">
        One missed step
        <span class="bubble-text bubble-text--warm" data-text="cascades">cascades</span>
        to production failure.
      </h1>

      <!-- =========================================================
           Radial anatomy diagram
           Center: MAJOR INCIDENT (warm)
           4 satellites at corners (cool/sapphire):
             TL Observability · TR Runbook · BL Codebase · BR External systems
           Warm dashed threads radiate from center through each
           ========================================================= -->
      <div class="diagram">

        <!-- Connecting threads — drawn first so they sit behind the nodes -->
        <svg class="diagram__svg" viewBox="0 0 1158 538" preserveAspectRatio="none">
          <defs>
            <marker id="cascadeArrow" viewBox="0 0 10 10"
                    refX="6" refY="5"
                    markerWidth="7" markerHeight="7"
                    orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z"
                    fill="oklch(72% 0.18 15 / 0.95)" />
            </marker>
            <radialGradient id="centerHalo" cx="50%" cy="50%" r="50%">
              <stop offset="0%"  stop-color="oklch(72% 0.18 15 / 0.16)"/>
              <stop offset="60%" stop-color="oklch(72% 0.18 15 / 0.04)"/>
              <stop offset="100%" stop-color="oklch(72% 0.18 15 / 0)"/>
            </radialGradient>
          </defs>

          <!-- Soft warm halo behind the center to read as the radiating impact -->
          <circle cx="579" cy="269" r="220" fill="url(#centerHalo)" />

          <!-- Threads radiate outward from incident edge to each satellite icon edge.
               Stroke: warm dashed, 1.4px. Arrow markers point OUTWARD (cascade direction). -->

          <!-- TL · Observability -->
          <path d="M 487 230 C 400 198, 290 152, 196 110"
                fill="none"
                stroke="oklch(72% 0.18 15 / 0.85)"
                stroke-width="1.4"
                stroke-dasharray="5 4"
                marker-end="url(#cascadeArrow)" />

          <!-- TR · Runbook -->
          <path d="M 671 230 C 758 198, 868 152, 962 110"
                fill="none"
                stroke="oklch(72% 0.18 15 / 0.85)"
                stroke-width="1.4"
                stroke-dasharray="5 4"
                marker-end="url(#cascadeArrow)" />

          <!-- BL · Codebase -->
          <path d="M 487 308 C 400 340, 290 386, 196 428"
                fill="none"
                stroke="oklch(72% 0.18 15 / 0.85)"
                stroke-width="1.4"
                stroke-dasharray="5 4"
                marker-end="url(#cascadeArrow)" />

          <!-- BR · External systems -->
          <path d="M 671 308 C 758 340, 868 386, 962 428"
                fill="none"
                stroke="oklch(72% 0.18 15 / 0.85)"
                stroke-width="1.4"
                stroke-dasharray="5 4"
                marker-end="url(#cascadeArrow)" />
        </svg>

        <!-- ============== CENTER · Major incident ============== -->
        <div class="incident">
          <div class="incident__chrome">
            <span>Major Incident</span>
            <span class="incident__chrome-meta">sev-1</span>
          </div>
          <div class="incident__body">
            <!-- Warning triangle glyph -->
            <svg width="58" height="50" viewBox="0 0 58 50" aria-hidden="true">
              <path d="M 29 4 L 54 46 L 4 46 Z"
                    fill="oklch(40% 0.10 15 / 0.18)"
                    stroke="oklch(72% 0.18 15)"
                    stroke-width="1.6"
                    stroke-linejoin="round"/>
              <line x1="29" y1="20" x2="29" y2="34"
                    stroke="oklch(82% 0.16 25)" stroke-width="2.4" stroke-linecap="round"/>
              <circle cx="29" cy="40" r="1.6" fill="oklch(82% 0.16 25)"/>
            </svg>
            <span class="incident__sub">02:47 utc · prod</span>
          </div>
        </div>

        <!-- ============== TL · Observability ============== -->
        <div class="sat sat--tl">
          <div class="sat__icon" aria-hidden="true">
            <!-- Sparkline -->
            <svg width="68" height="36" viewBox="0 0 68 36">
              <polyline fill="none" stroke="var(--cool-stroke)" stroke-width="1.4"
                        points="4,28 14,24 24,26 34,18 44,14 54,8 62,4"/>
              <circle cx="62" cy="4" r="2" fill="var(--cool-stroke)"/>
            </svg>
          </div>
          <div class="sat__label">Observability</div>
        </div>

        <!-- ============== TR · Runbook ============== -->
        <div class="sat sat--tr">
          <div class="sat__icon" aria-hidden="true">
            <!-- Step rows -->
            <svg width="68" height="36" viewBox="0 0 68 36">
              <circle cx="8"  cy="8"  r="2" fill="var(--cool-stroke)"/>
              <line x1="14" y1="8"  x2="60" y2="8"  stroke="var(--cool-stroke)" stroke-width="1.2"/>
              <circle cx="8"  cy="18" r="2" fill="var(--cool-stroke)"/>
              <line x1="14" y1="18" x2="50" y2="18" stroke="var(--cool-stroke)" stroke-width="1.2"/>
              <circle cx="8"  cy="28" r="2" fill="var(--cool-stroke)"/>
              <line x1="14" y1="28" x2="42" y2="28" stroke="var(--cool-stroke)" stroke-width="1.2"/>
            </svg>
          </div>
          <div class="sat__label">Runbook</div>
        </div>

        <!-- ============== BL · Codebase ============== -->
        <div class="sat sat--bl">
          <div class="sat__icon" aria-hidden="true">
            <!-- { } glyph -->
            <svg width="68" height="36" viewBox="0 0 68 36">
              <text x="34" y="26" text-anchor="middle"
                    font-family="JetBrains Mono, monospace" font-size="22" font-weight="700"
                    fill="var(--cool-stroke)">{ }</text>
            </svg>
          </div>
          <div class="sat__label">Codebase</div>
        </div>

        <!-- ============== BR · External systems ============== -->
        <div class="sat sat--br">
          <div class="sat__icon" aria-hidden="true">
            <!-- 3-node network -->
            <svg width="68" height="36" viewBox="0 0 68 36">
              <line x1="14" y1="9"  x2="54" y2="9"  stroke="var(--cool-stroke)" stroke-width="1.1"/>
              <line x1="14" y1="11" x2="34" y2="27" stroke="var(--cool-stroke)" stroke-width="1.1"/>
              <line x1="54" y1="11" x2="34" y2="27" stroke="var(--cool-stroke)" stroke-width="1.1"/>
              <rect x="8"  y="4"  width="12" height="10" rx="2"
                    fill="var(--cool-fill)" stroke="var(--cool-stroke)" stroke-width="1.2"/>
              <rect x="48" y="4"  width="12" height="10" rx="2"
                    fill="var(--cool-fill)" stroke="var(--cool-stroke)" stroke-width="1.2"/>
              <rect x="28" y="22" width="12" height="10" rx="2"
                    fill="var(--cool-fill)" stroke="var(--cool-stroke)" stroke-width="1.2"/>
            </svg>
          </div>
          <div class="sat__label">External systems</div>
        </div>

      </div>
      <!-- END diagram -->

    </div>
  </div>
</body>
</html>
